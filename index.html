<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Bakery</title>
    <style>
      :root { color-scheme: light; font-family: Georgia, "Times New Roman", serif; }
      body { margin: 0; background: #fff8f0; color: #2b1d12; }
      main { max-width: 720px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
      .eyebrow { letter-spacing: 0.18em; text-transform: uppercase; font-size: 0.75rem; color: #8a5a2b; }
      h1 { font-size: 2.6rem; line-height: 1.1; margin: 0.4rem 0 1rem; }
      p { font-size: 1.1rem; line-height: 1.6; }
      .hours { margin-top: 2rem; padding: 1rem 1.25rem; background: #fff; border: 1px solid #ead7c0; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Neighborhood bakery</p>
      <h1>Fresh bread, every morning</h1>
      <p>
        Acme Bakery bakes sourdough, croissants, and seasonal tarts from a
        wood-fired oven on Maple Street. Come early for the still-warm loaves.
      </p>
      <div class="hours">
        <strong>Hours</strong>
        <p>Tuesday–Sunday, 7am–3pm. Closed Mondays.</p>
      </div>
    </main>
  </body>
</html>
